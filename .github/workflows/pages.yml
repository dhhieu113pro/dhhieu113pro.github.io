name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages
        uses: actions/checkout@v4

      - name: Checkout pinned Ad Blocker UI source
        uses: actions/checkout@v4
        with:
          repository: dhhieu113pro/adblocker-extension
          ref: 7c50e4b731897b65fa3aab6dd72124a7e94b47ce
          path: adblocker-source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate pinned Microsoft Edge Store screenshots
        shell: bash
        run: |
          set -euo pipefail
          cd adblocker-source
          npm ci
          npm run build
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          npm run test:e2e
          node scripts/generate-edge-store-screenshots.mjs
          cd ..
          mkdir -p adblocker/assets
          cp adblocker-source/artifacts/edge-store/01-overview.png adblocker/assets/01-overview.png
          cp adblocker-source/artifacts/edge-store/02-settings.png adblocker/assets/02-settings.png
          cp adblocker-source/artifacts/edge-store/03-history.png adblocker/assets/03-history.png

      - name: Install Pages Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Run landing-page browser contract
        run: npx playwright test

      - name: Upload generated Store screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adblocker-store-screenshots-${{ github.run_id }}
          path: adblocker/assets/*.png
          if-no-files-found: error
          retention-days: 90

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-playwright-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages
        uses: actions/checkout@v4
        with:
          path: pages

      - name: Checkout Quay
        uses: actions/checkout@v4
        with:
          repository: dhhieu113pro/quay
          ref: main
          path: quay-source

      - name: Checkout LocalCodingMcp
        uses: actions/checkout@v4
        with:
          repository: dhhieu113pro/local-coding-mcp
          ref: main
          path: local-coding-mcp-source

      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/quay site/local-coding-mcp
          cp pages/index.html site/index.html
          cp -R quay-source/docs/. site/quay/
          cp -R local-coding-mcp-source/docs/. site/local-coding-mcp/
          test -f site/local-coding-mcp/index.html
          test -f site/local-coding-mcp/logo.svg
          test -f site/local-coding-mcp/how-it-works.svg
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
