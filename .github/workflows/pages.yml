name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages
        uses: actions/checkout@v4
        with:
          path: pages

      - name: Checkout Quay
        uses: actions/checkout@v4
        with:
          repository: dhhieu113pro/quay
          ref: main
          path: quay-source

      - name: Checkout Butchi
        uses: actions/checkout@v4
        with:
          repository: dhhieu113pro/butchi
          ref: main
          path: butchi-source

      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/quay site/butchi
          cp pages/index.html site/index.html
          cp -R quay-source/docs/. site/quay/
          cp -R butchi-source/docs/. site/butchi/
          python - <<'PY'
          from pathlib import Path
          path = Path('site/index.html')
          html = path.read_text(encoding='utf-8')
          html = html.replace(
              'href="https://github.com/dhhieu113pro/butchi">View Butchi →</a>',
              'href="./butchi/">Explore Butchi →</a>',
              1,
          )
          html = html.replace(
              'https://raw.githubusercontent.com/dhhieu113pro/butchi/main/docs/assets/screenshot-popover.svg',
              './butchi/shots/popover-light.png',
              1,
          )
          path.write_text(html, encoding='utf-8')
          PY
          test -f site/index.html
          test -f site/quay/index.html
          test -f site/butchi/index.html
          touch site/.nojekyll

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
