name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages
        uses: actions/checkout@v4
        with:
          path: pages

      - name: Checkout Quay
        uses: actions/checkout@v4
        with:
          repository: dhhieu113pro/quay
          ref: main
          path: quay-source

      - name: Checkout Butchi
        uses: actions/checkout@v4
        with:
          repository: dhhieu113pro/butchi
          ref: main
          path: butchi-source

      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/quay site/butchi
          cp pages/index.html site/index.html
          cp -R quay-source/docs/. site/quay/
          cp -R butchi-source/docs/. site/butchi/
          test -f site/index.html
          test -f site/quay/index.html
          test -f site/butchi/index.html
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
