<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tập viết 123 — Bảng tập viết ô ly</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>Tập viết 123</h1>
      <p>Tạo chữ nét đứt trên giấy ô ly · tải PDF A4</p>
    </header>

    <div class="layout">
      <main class="sheet-column">
        <p class="hint">Khi in: khổ A4, tỉ lệ 100% (Actual size) để ô to đúng 10mm.</p>
        <div class="sheet" id="sheet" aria-label="Bảng tập viết"></div>
      </main>

      <aside class="settings">
        <h2>Cài đặt trang</h2>

        <label class="field">
          Loại vở
          <select id="paper">
            <option value="oly4">4 ô ly (tiểu học)</option>
            <option value="oly5">5 ô ly (tiểu học)</option>
            <option value="ke7">Kẻ ngang 7mm (cấp 2)</option>
          </select>
        </label>

        <div class="field">
          <span class="field-label">Font chữ</span>
          <div id="font" class="segmented" role="group" aria-label="Font chữ">
            <button type="button" data-value="vi" class="active">Tiếng Việt</button>
            <button type="button" data-value="en">Tiếng Anh</button>
          </div>
        </div>

        <label class="field">
          Mẫu bài
          <select id="lesson"></select>
        </label>

        <hr />

        <div class="field">
          <span class="field-label">Kiểu nét</span>
          <div id="style" class="segmented" role="group" aria-label="Kiểu nét">
            <button type="button" data-value="solid" class="active">Nét liền</button>
            <button type="button" data-value="outline">Nét chấm</button>
          </div>
        </div>

        <div class="field">
          <span class="field-label">Độ đậm</span>
          <div id="darkness" class="segmented" role="group" aria-label="Độ đậm">
            <button type="button" data-value="bold" class="active">Đậm</button>
            <button type="button" data-value="mild">Mờ 1</button>
            <button type="button" data-value="light">Mờ 2</button>
          </div>
        </div>

        <div class="field">
          <span class="field-label">Căn lề</span>
          <div id="align" class="segmented" role="group" aria-label="Căn lề">
            <button type="button" data-value="left" class="active">Trái</button>
            <button type="button" data-value="center">Giữa</button>
            <button type="button" data-value="right">Phải</button>
          </div>
        </div>

        <button id="download" class="download" type="button">Tải file PDF</button>
      </aside>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
